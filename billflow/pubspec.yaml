name: billflow
description: BillFlow POS mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3+1

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Barcode scanning
  mobile_scanner: ^5.1.1

  # Charts
  fl_chart: ^0.68.0

  # Local notifications
  flutter_local_notifications: ^17.1.2

  # WhatsApp / URL launching
  url_launcher: ^6.3.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1E3A5F"
  image: assets/images/app_icon.png
  android: true
  ios: false
  android_gravity: center
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
